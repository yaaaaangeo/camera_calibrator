name: Ghost Windshield Tests

on:
  push:
  pull_request:

jobs:
  ghost-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ghost evaluation/suppression/UI-architecture and project IO regression tests
        run: |
          python -m pytest -q \
            tests/test_windshield_ghost.py \
            tests/test_windshield_ghost_suppression.py \
            tests/test_windshield_ghost_ui_architecture.py \
            tests/test_windshield_project_io.py

name: Ghost Windshield Tests

on:
  push:
  pull_request:

jobs:
  ghost-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ghost evaluation/suppression/UI-architecture tests
        run: |
          python -m pytest -q \
            tests/test_windshield_ghost.py \
            tests/test_windshield_ghost_suppression.py \
            tests/test_windshield_ghost_ui_architecture.py

      # project_io.py는 별도 프로세스(별도 step)로 돌린다 - 이 파일에는
      # torch가 설치된 환경에서만 도는 Neural Residual round-trip 테스트가
      # 있다(`pytest.importorskip("torch")`로 보호되어 `[dev]` extra만
      # 설치된 이 워크플로우에서는 정상적으로 skip된다). 별도 step으로 두면
      # 혹시 다른 환경(예: neural extra가 함께 설치된 러너)에서 torch+scipy
      # 네이티브 라이브러리 충돌이 발생하더라도 Ghost 테스트 결과 자체는
      # 이미 이전 step에서 독립적으로 보고된 뒤이므로 서로 영향을 주지 않는다.
      - name: Run Ghost-related Project IO regression tests
        run: |
          python -m pytest -q tests/test_windshield_project_io.py

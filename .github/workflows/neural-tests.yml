name: Neural Windshield Tests

on:
  push:
  pull_request:

jobs:
  neural-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install neural test dependencies
        run: python -m pip install -e ".[dev,neural]"

      - name: Run neural windshield tests
        run: |
          python -m pytest -q \
            tests/test_neural_torch_lazy_import.py \
            tests/test_windshield_neural_residual.py \
            tests/test_windshield_neural_residual_stabilization.py \
            tests/test_windshield_workspace_ui.py \
            tests/test_windshield_worker_architecture.py \
            tests/test_windshield_project_io.py \
            tests/test_windshield_projection.py \
            tests/test_windshield_export.py

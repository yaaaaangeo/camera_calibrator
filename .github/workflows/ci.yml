name: General CI

# Phase D-4 안정화 - 흩어진 기능별 워크플로우(ghost/reflection/reflection-suppression/
# neural-tests.yml)는 그대로 둔 채, "핵심 회귀가 통과하는가"를 하나의 워크플로우로
# 항상 확인할 수 있게 한다. 이 워크플로우는 torch(neural extra)를 설치하지 않는다 -
# Neural Residual 전용 회귀는 neural-tests.yml이 계속 담당한다(사용자 스펙 - 이번
# 라운드에서 기존 기능별 CI를 대체하지 않는다).

on:
  push:
  pull_request:

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime dependencies
        # PySide6 wheel은 Qt 바이너리를 자체 포함하지만, 그 바이너리가
        # 런타임에 동적 링크하는 libEGL/libGL은 ubuntu-latest 기본 이미지에
        # 없다 - import 단계에서 `ImportError: libEGL.so.1: cannot open
        # shared object file`로 UI 관련 테스트 파일들이 collection 자체에서
        # 죽는다(pytest 로직과 무관). Xvfb 등 실제 디스플레이 서버는 필요
        # 없다 - QT_QPA_PLATFORM=offscreen이 헤드리스로 대체한다.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fast core regression (pytest -m "not slow")
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow"

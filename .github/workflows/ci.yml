name: General CI

# Phase D-4 안정화 - 흩어진 기능별 워크플로우(ghost/reflection/reflection-suppression/
# neural-tests.yml)는 그대로 둔 채, "핵심 회귀가 통과하는가"를 하나의 워크플로우로
# 항상 확인할 수 있게 한다. 이 워크플로우는 torch(neural extra)를 설치하지 않는다 -
# Neural Residual 전용 회귀는 neural-tests.yml이 계속 담당한다(사용자 스펙 - 이번
# 라운드에서 기존 기능별 CI를 대체하지 않는다).

on:
  push:
  pull_request:

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fast core regression (pytest -m "not slow")
        run: python -m pytest -q -m "not slow"

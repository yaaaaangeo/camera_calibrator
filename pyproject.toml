[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-calibrator"
version = "0.2.0"
description = "ChArUco 기반 카메라 캘리브레이션 도구 - Ideal Pinhole/Brown-Conrady/Rational/Fisheye 4모델 비교 + Hold-out 검증 + 근거 기반 모델 추천"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yaaaaangeo" }]

# requirements.txt와 동일한 패키지/하한선을 반영한다(Phase A-3 안정화 -
# 이전에는 이 파일과 requirements.txt가 서로 다른 OpenCV package
# (opencv-contrib-python vs opencv-python)를 선언해서 `pip install -e .`와
# `pip install -r requirements.txt`가 실제로 다른 dependency graph를
# 만들었다). cv2.aruco/ChArUco/calibrateCameraRO/cv2.fisheye를 쓰므로
# contrib build가 필수이고, GUI는 PySide6가 전담하며 이 프로젝트 어디서도
# cv2 자체의 highgui(cv2.imshow 등)를 쓰지 않으므로 headless wheel로
# 통일한다 - Jetson에서 이미 쓰던 것과 같은 정책이다(OpenCV가 번들하는
# Qt5 plugin이 PySide6의 Qt6 platform plugin과 충돌할 여지를 원천 차단).
# 상세 이유는 requirements.txt 주석 참고.
dependencies = [
    # Priority 7 안정화 - cv2.fisheye.solvePnP()(calibration/models/common.py::
    # solve_pnp_for_model)는 OpenCV 4.10.0에서 추가됐다(opencv/opencv#25028).
    # requirements.txt와 동일하게 4.9에서 4.10으로 올린다 - 상세 이유는
    # requirements.txt 주석 참고.
    "opencv-contrib-python-headless>=4.10",
    "numpy>=1.24",
    # Priority 6 안정화 - 이전에는 이 파일이 scipy>=1.10, requirements.txt가
    # scipy>=1.11을 선언해 서로 다른 최소 버전을 요구했다. scipy 1.10 floor가
    # 실제로 검증된 적이 없어(이 프로젝트가 쓰는 scipy.interpolate.
    # RBFInterpolator/scipy.spatial.cKDTree/scipy.optimize.least_squares 등은
    # 훨씬 오래된 버전에서도 존재하지만, requirements.txt의 1.11이 실제
    # 개발/검증에 쓰인 버전이었다) 더 낮춰서 통일하지 않고, 이미 검증된 쪽인
    # requirements.txt의 하한선(1.11)에 맞춰 올렸다.
    "scipy>=1.11",
    "PyYAML>=6.0",
    "PySide6>=6.5.3",
]

[project.optional-dependencies]
# rosbag(.bag/.db3/.mcap)에서 이미지를 직접 불러오는 기능에만 필요한 선택 의존성.
# `pip install camera-calibrator[ros]`로 함께 설치 가능.
ros = ["rosbags>=0.9"]

# Neural Residual Windshield 모델(calibration/windshield/neural_residual.py,
# residual_ray_hint["method"]=="neural")에만 필요한 선택 의존성. 다른 모든
# 기능(Baseline/Spherical/Residual Grid/Residual RBF/Spline 포함)은 이
# extra 없이도 완전히 동작한다 - `pip install camera-calibrator[neural]`로
# 함께 설치 가능. Jetson 등 aarch64/CUDA 환경에서는 이 일반 PyPI wheel
# 대신 플랫폼에 맞는 NVIDIA PyTorch wheel을 별도로 설치해야 한다(README/
# requirements-jetson*.txt 참고 - 그 파일들에는 이 extra를 넣지 않는다).
neural = ["torch>=2.0"]

# 테스트 스위트 실행에만 필요 (requirements-dev.txt와 동일 구성).
dev = [
    "pytest>=7.4",
    "rosbags>=0.9",
]

[project.urls]
Repository = "https://github.com/yaaaaangeo/camera_calibrator"

# `pip install -e .` 후 터미널 어디서든 바로 실행 가능하게 하는 콘솔 커맨드.
# app/main.py, app/cli.py에 이미 있는 main() 함수를 그대로 연결한다 - 이 함수들
# 자체는 손대지 않았으므로 `python -m app.main` / `python -m app.cli`로 실행하던
# 기존 방식도 계속 동일하게 동작한다.
[project.scripts]
camera-calibrator = "app.main:main"
camera-calibrator-cli = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "calibration*", "export*", "ui*"]
exclude = ["tests*", "scripts*"]

# pytest 설정은 기존 pytest.ini를 그대로 유지한다 (pytest.ini가 있으면 pytest는
# pyproject.toml의 [tool.pytest.ini_options]를 아예 읽지 않으므로, 여기 중복
# 정의하면 오히려 "어느 게 적용되는지" 헷갈리기만 한다).
